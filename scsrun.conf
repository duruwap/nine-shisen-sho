# scs-run.sh 설정 (bash 로 source 됨)

PORT=15004
BIND_HOST=0.0.0.0
WSGI_APP="wsgi:app"

# gunicorn: 상태 없는 앱이라 워커를 늘려도 무방
WORKERS=2
THREADS=4
TIMEOUT=30

# 외부 공개 주소 (카카오톡 등 링크 미리보기의 og:image 절대 URL 에 사용)
PUBLIC_URL="https://nine.duruwap.com"

# 기동 후 헬스체크 경로 (빈 값이면 생략)
HEALTH_PATH="/healthz"

# 일별 로그 보관 일수 (기동 시 오래된 파일 삭제)
LOG_KEEP_DAYS=30
